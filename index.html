<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>G-HP Master V5.1 | Ecosystem</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0ea5e9; --accent: #f59e0b; --bg: #020617; --card-bg: rgba(15, 23, 42, 0.95);
            --border: rgba(255, 255, 255, 0.1); --text: #f8fafc; --text-dim: #94a3b8;
            --header-h: 110px; --footer-h: 75px; --danger: #ef4444;
            --cat-print: #10b981; --cat-docs: #3b82f6; --cat-design: #8b5cf6; --cat-retail: #f97316; --cat-util: #ef4444;
        }

        [data-theme="light"] {
            --bg: #f1f5f9; --card-bg: rgba(255, 255, 255, 0.98); --border: rgba(0, 0, 0, 0.1); --text: #0f172a; --text-dim: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; background-color: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); }

        /* HEADER */
        header {
            height: var(--header-h); width: 100%; position: absolute; top: 0;
            background: var(--card-bg); border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; backdrop-filter: blur(10px);
        }
        .brand h1 { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; }
        .brand b { color: var(--accent); }
        .apex-counter-hub { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; text-align: center; color: var(--accent); background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 50px; border: 1px solid var(--border); margin-top: 5px; }

        /* MAIN AREA */
        main { position: absolute; top: var(--header-h); bottom: var(--footer-h); width: 100%; overflow-y: auto; padding: 15px; }
        .tab-content { display: none; width: 100%; max-width: 600px; margin: 0 auto; padding-bottom: 30px; }
        .tab-content.active { display: block; }

        /* GRID & CARDS */
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .app-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
            padding: 20px 10px; text-align: center; text-decoration: none; color: inherit;
            position: relative; display: flex; flex-direction: column; align-items: center;
        }
        .app-card::before { content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%; border-radius: 18px 0 0 18px; }
        .app-card i { font-size: 1.8rem; color: var(--accent); margin-bottom: 8px; }
        .app-card h4 { font-size: 0.8rem; font-weight: 700; }
        
        .c-print::before { background: var(--cat-print); } .c-docs::before { background: var(--cat-docs); } 
        .c-design::before { background: var(--cat-design); } .c-retail::before { background: var(--cat-retail); } 
        .c-util::before { background: var(--cat-util); }

        /* ADMIN UI */
        .admin-box { background: var(--card-bg); padding: 18px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; }
        .admin-box h3 { font-size: 0.9rem; margin-bottom: 12px; color: var(--accent); display: flex; justify-content: space-between; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.8rem; }
        
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; }
        .btn-accent { background: var(--accent); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; font-size: 0.7rem; padding: 5px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }

        /* LISTA DE GERENCIAMENTO */
        .manage-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border); font-size: 0.75rem; }

        /* FOOTER NAV */
        nav.bottom-nav {
            height: var(--footer-h); width: 100%; position: absolute; bottom: 0;
            background: var(--card-bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-item { background: none; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.6rem; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="brand"><h1>G-HP Master <b>V5</b></h1></div>
        <div class="apex-counter-hub">SISTEMAS: <b id="gCount">...</b> | ACESSOS: <b id="lCount">0</b></div>
    </header>

    <main>
        <!-- ABA: VITRINE -->
        <section id="tab-hub" class="tab-content active">
            <div id="newsFeed"></div>
            <div class="app-grid" id="appGrid">
                <!-- Apps injetados via JS -->
            </div>
        </section>

        <!-- ABA: ADMIN -->
        <section id="tab-admin" class="tab-content">
            <div id="adminAuth">
                <div class="admin-box">
                    <h3>Acesso Administrativo</h3>
                    <div class="form-group">
                        <input type="password" id="mPass" placeholder="Senha Master...">
                    </div>
                    <button class="btn btn-accent" onclick="authAdmin()">ENTRAR NO PAINEL</button>
                </div>
            </div>

            <div id="adminPanel" style="display:none;">
                <div class="admin-box">
                    <h3>Novo Aplicativo</h3>
                    <div class="form-group"><input type="text" id="addName" placeholder="Nome do App"></div>
                    <div class="form-group"><input type="url" id="addUrl" placeholder="URL do GitHub Pages"></div>
                    <div class="form-group">
                        <select id="addCat">
                            <option value="c-docs">Documentos</option>
                            <option value="c-print">Impressão</option>
                            <option value="c-design">Design</option>
                            <option value="c-retail">Vendas</option>
                            <option value="c-util">Úteis</option>
                        </select>
                    </div>
                    <button class="btn btn-accent" onclick="db_addApp()"><i class="fas fa-plus"></i> PUBLICAR AGORA</button>
                </div>

                <div class="admin-box">
                    <h3>Gerenciar Ecossistema</h3>
                    <div id="manageList">
                        <!-- Lista de apps com botão excluir -->
                    </div>
                </div>

                <div class="admin-box">
                    <h3>Mural de Avisos</h3>
                    <div class="form-group"><textarea id="newsText" placeholder="Texto da notícia..." rows="2"></textarea></div>
                    <button class="btn btn-outline" onclick="db_updateInfo()">ATUALIZAR MURAL</button>
                </div>

                <button class="btn btn-outline" onclick="logoutAdmin()" style="color: var(--danger);">SAIR DO PAINEL</button>
                <button class="btn" style="background:none; color:gray; font-size:0.5rem" onclick="db_reset()">Resetar Cache Local</button>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('tab-hub', this)"><i class="fas fa-th-large"></i><span>Hub</span></button>
        <button class="nav-item" onclick="switchTab('tab-admin', this)"><i class="fas fa-shield-halved"></i><span>Admin</span></button>
        <button class="nav-item" onclick="window.open('https://wa.me/5561999487649')"><i class="fas fa-headset"></i><span>Suporte</span></button>
    </nav>

    <script>
        // --- CONFIGURAÇÃO ---
        const firebaseConfig = {
            databaseURL: "https://ghp-ecosystem-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let appState = { apps: [] };

        // --- INICIALIZAÇÃO ---
        window.onload = () => {
            syncFirebase();
            initApexCounter();
        };

        function syncFirebase() {
            // Escuta Apps
            database.ref('ghp_v5/apps').on('value', snapshot => {
                const data = snapshot.val();
                appState.apps = data ? Object.keys(data).map(k => ({...data[k], key: k})) : [];
                renderApps();
                renderManageList();
            });

            // Escuta Mural
            database.ref('ghp_v5/news').limitToLast(1).on('value', snapshot => {
                const data = snapshot.val();
                if(data) {
                    const latest = Object.values(data)[0];
                    document.getElementById('newsFeed').innerHTML = `
                        <div style="background:var(--accent); color:#000; padding:10px; border-radius:10px; margin-bottom:15px; font-size:0.8rem; font-weight:bold;">
                            <i class="fas fa-bullhorn"></i> ${latest.text}
                        </div>
                    `;
                }
            });
        }

        // --- RENDERIZADORES ---
        function renderApps() {
            const container = document.getElementById('appGrid');
            if(appState.apps.length === 0) { container.innerHTML = "<p>Nenhum app conectado.</p>"; return; }
            container.innerHTML = appState.apps.map(app => `
                <a href="${app.url}" target="_blank" class="app-card ${app.cat}">
                    <i class="fas fa-rocket"></i>
                    <h4>${app.name}</h4>
                </a>
            `).join('');
        }

        function renderManageList() {
            const container = document.getElementById('manageList');
            container.innerHTML = appState.apps.map(app => `
                <div class="manage-item">
                    <span>${app.name}</span>
                    <button class="btn-danger" onclick="db_deleteApp('${app.key}')">EXCLUIR</button>
                </div>
            `).join('');
        }

        // --- ADMIN LOGIC ---
        function authAdmin() {
            if(document.getElementById('mPass').value === 'hp2026') {
                document.getElementById('adminAuth').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else { alert("Senha incorreta!"); }
        }

        function logoutAdmin() {
            document.getElementById('adminAuth').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('mPass').value = '';
        }

        // --- DATABASE CRUD ---
        function db_addApp() {
            const name = document.getElementById('addName').value;
            const url = document.getElementById('addUrl').value;
            const cat = document.getElementById('addCat').value;
            
            if(!name || !url) return alert("Preencha tudo!");

            database.ref('ghp_v5/apps').push({ name, url, cat })
                .then(() => {
                    alert("Sucesso!");
                    document.getElementById('addName').value = '';
                    document.getElementById('addUrl').value = '';
                })
                .catch(err => {
                    console.error(err);
                    alert("ERRO DE PERMISSÃO: Verifique as regras do Firebase.");
                });
        }

        function db_deleteApp(key) {
            if(confirm("Deseja remover este app?")) {
                database.ref(`ghp_v5/apps/${key}`).remove();
            }
        }

        function db_updateInfo() {
            const text = document.getElementById('newsText').value;
            if(!text) return;
            database.ref('ghp_v5/news').push({ text, date: Date.now() })
                .then(() => alert("Mural atualizado!"))
                .catch(() => alert("Erro ao atualizar mural."));
        }

        // --- UI UTILS ---
        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function db_reset() {
            localStorage.clear();
            location.reload();
        }

        function initApexCounter() {
            let local = parseInt(localStorage.getItem('ghp_v5_hits')) || 0;
            local++;
            localStorage.setItem('ghp_v5_hits', local);
            document.getElementById('lCount').textContent = local;
            // Simulação de rede global
            const base = 15200;
            const daily = 35;
            const start = new Date('2025-01-01').getTime();
            const diff = Math.floor((Date.now() - start) / 86400000);
            document.getElementById('gCount').textContent = (base + (diff * daily) + local).toLocaleString();
        }
    </script>
</body>
</html>
